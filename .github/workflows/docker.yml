name: Build and Publish Docker Image

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./HPSkyStatusUpdator
          file: ./HPSkyStatusUpdator/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hpskystatusupdator:latest
            ghcr.io/${{ github.repository_owner }}/hpskystatusupdator:${{ github.sha }}
