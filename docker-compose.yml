services:

  hpstatus:

    container_name: hpstatus

    build:
      context: ./HPSkyStatusUpdator
      dockerfile: Dockerfile

    restart: unless-stopped


    ports:
      - "5122:5122"
      - "5123:5123"


    environment:

      ASPNETCORE_ENVIRONMENT: Production

      ASPNETCORE_URLS: http://+:5122;http://+:5123

      DATA_PATH: /app/Data
      HYPIXEL_API_KEY: ${HYPIXEL_API_KEY}
      ADMIN_KEY: ${ADMIN_KEY}

    volumes:

      - ./Data:/app/Data
